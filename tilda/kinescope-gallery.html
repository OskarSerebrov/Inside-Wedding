<style>
  .inside-wedding-gallery {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 24px;
    width: 100%;
    max-width: 1200px;
    margin-right: auto;
    margin-left: auto;
  }

  .inside-wedding-gallery__item {
    min-width: 0;
    margin: 0;
  }

  .inside-wedding-player {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: #000;
  }

  .inside-wedding-player__video {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 9 / 16;
    object-fit: cover;
  }

  .inside-wedding-player__play {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 2;
    display: grid;
    width: 72px;
    height: 72px;
    padding: 0;
    transform: translate(-50%, -50%);
    place-items: center;
    border: 0;
    border-radius: 0;
    background: #000;
    cursor: pointer;
    appearance: none;
  }

  .inside-wedding-player__play[hidden] {
    display: none;
  }

  .inside-wedding-player__play::before {
    width: 0;
    height: 0;
    margin-left: 5px;
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
    border-left: 21px solid #fff;
    content: '';
  }

  .inside-wedding-player__play:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 3px;
  }

  @media (max-width: 479px) {
    .inside-wedding-player__play {
      width: 60px;
      height: 60px;
    }

    .inside-wedding-player__play::before {
      margin-left: 4px;
      border-top-width: 11px;
      border-bottom-width: 11px;
      border-left-width: 18px;
    }
  }

  .inside-wedding-gallery__title {
    margin: 10px 0 0;
    color: #111;
    font: 500 16px/1.35 Arial, sans-serif;
  }

  @media (max-width: 959px) {
    .inside-wedding-gallery {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 479px) {
    .inside-wedding-gallery {
      grid-template-columns: minmax(0, 1fr);
      gap: 32px;
    }
  }
</style>

<script>
  (function () {
    function initPlayer(player) {
      if (player.getAttribute('data-inside-player-ready') === 'true') {
        return;
      }

      var video = player.querySelector('.inside-wedding-player__video');
      var button = player.querySelector('.inside-wedding-player__play');

      player.setAttribute('data-inside-player-ready', 'true');
      video.controls = false;
      button.hidden = false;

      button.addEventListener('click', function () {
        video.controls = true;
        var playPromise = video.play();

        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(function () {
            video.controls = false;
            button.hidden = false;
          });
        }
      });

      video.addEventListener('play', function () {
        button.hidden = true;
      });

      video.addEventListener('ended', function () {
        video.controls = false;
        video.currentTime = 0;
        button.hidden = false;
      });
    }

    document.querySelectorAll('[data-inside-player]').forEach(initPlayer);
  }());
</script>
