<div class="inside-wedding-player" data-inside-player>
  <video
    class="inside-wedding-player__video"
    controls
    playsinline
    preload="metadata"
    poster="https://cdn.jsdelivr.net/gh/OskarSerebrov/Inside-Wedding@v2.2-play-button/posters/Reels%205.jpg"
    aria-label="Reels 5"
  >
    <source
      src="https://cdn.jsdelivr.net/gh/OskarSerebrov/Inside-Wedding@v2.2-play-button/videos/Reels%205.mp4"
      type="video/mp4"
    >
    Ваш браузер не поддерживает воспроизведение видео.
  </video>

  <button
    class="inside-wedding-player__play"
    type="button"
    aria-label="Воспроизвести Reels 5"
    hidden
  ></button>
</div>

<style>
  .inside-wedding-player {
    position: relative;
    width: 100%;
    max-width: 540px;
    margin-right: auto;
    margin-left: auto;
    overflow: hidden;
    background: #000;
  }

  .inside-wedding-player__video {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 9 / 16;
    object-fit: cover;
  }

  .inside-wedding-player__play {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 2;
    display: grid;
    width: 72px;
    height: 72px;
    padding: 0;
    transform: translate(-50%, -50%);
    place-items: center;
    border: 0;
    border-radius: 0;
    background: #000;
    cursor: pointer;
    appearance: none;
  }

  .inside-wedding-player__play[hidden] {
    display: none;
  }

  .inside-wedding-player__play::before {
    width: 0;
    height: 0;
    margin-left: 5px;
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
    border-left: 21px solid #fff;
    content: '';
  }

  .inside-wedding-player__play:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 3px;
  }

  @media (max-width: 479px) {
    .inside-wedding-player__play {
      width: 60px;
      height: 60px;
    }

    .inside-wedding-player__play::before {
      margin-left: 4px;
      border-top-width: 11px;
      border-bottom-width: 11px;
      border-left-width: 18px;
    }
  }
</style>

<script>
  (function () {
    function initPlayer(player) {
      if (player.getAttribute('data-inside-player-ready') === 'true') {
        return;
      }

      var video = player.querySelector('.inside-wedding-player__video');
      var button = player.querySelector('.inside-wedding-player__play');

      player.setAttribute('data-inside-player-ready', 'true');
      video.controls = false;
      button.hidden = false;

      button.addEventListener('click', function () {
        video.controls = true;
        var playPromise = video.play();

        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(function () {
            video.controls = false;
            button.hidden = false;
          });
        }
      });

      video.addEventListener('play', function () {
        button.hidden = true;
      });

      video.addEventListener('ended', function () {
        video.controls = false;
        video.currentTime = 0;
        button.hidden = false;
      });
    }

    document.querySelectorAll('[data-inside-player]').forEach(initPlayer);
  }());
</script>
